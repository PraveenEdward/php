services:
  mysql:
    container_name: mysql
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: toor
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptoor --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "3306:3306"

  php:
    container_name: php
    build:
      context: .
      dockerfile: Dockerfile
    image: php:latest
    env_file:
      - .env
    volumes:
      - /home/ubuntu/php/app/uploads:/var/www/html/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:80"

